########################
### Project Metadata ###
########################

[project]
name = "soul-of-waifu"
version = "2.5.0"
description = "Soul of Waifu desktop companion app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Dependencies are managed via Pixi.
]

####################
### Build config ###
####################

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

###################
### Pixi config ###
###################

[tool.pixi.workspace]
name = "soul-of-waifu"
platforms = ["win-64", "linux-64"]
channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"]
# Required until the build feature becomes stable
preview = ["pixi-build"]

### Dependency tables

[tool.pixi.dependencies]
python = ">=3.11,<3.12"
pip = "*"
# setuptools = ">=80,<81"
setuptools = "*"
sox = "*"

[tool.pixi.pypi-dependencies]
aiohttp = "==3.11.13"
"antlr4-python3-runtime" = "==4.9.3"
av = "*"
beautifulsoup4 = "*"
"coqui-tts" = { version = "*", extras = ["codec"] }
"curl-cffi" = "*"
davey = "*"
ddgs = "*"
"discord.py" = "*"
"edge-tts" = "==7.2.7"
elevenlabs = "==1.52.0"
# fairseq is installed per-platform below: PyPI's 0.12.2 build fails to import
# on Python 3.11 (mutable dataclass defaults raise ValueError). Windows uses
# Jmica's community-patched wheel; Linux uses a locally patched build.
faster-whisper = "*"
gputil = "==1.4.0"
"hf-transfer" = "==0.1.9"
"huggingface-hub" = "==0.36.0"
kokoro = "==0.9.4"
"live2d-py" = "==0.5.4"
# Pinned <2.0.0: mistralai 2.x restructured into a namespace package (Mistral
# client moved to mistralai.client.sdk.Mistral), breaking `from mistralai import Mistral`.
mistralai = "==1.5.0"
mss = "*"
numpy = "==1.26.4"
omegaconf = "==2.3.0"
openai = "==1.70.0"
pillow = "==11.3.0"
playwright = "*"
portalocker = "==3.2.0"
"praat-parselmouth" = "*"
psutil = "==7.0.0"
pyaudio = "*"
pydub = "==0.25.1"
pynacl = "*"
pyopengl = "==3.1.9"
pypdf = "*"
pyqt6 = "==6.9.0"
"pyqt6-webengine" = "==6.9.0"
"python-docx" = "*"
python-multipart = "*"
pyworld = "*"
pyyaml = "==6.0.2"
qasync = "==0.27.1"
"qwen-tts" = "*"
pyautogui = "*"
requests = "==2.32.3"
"rvc-python" = { git = "https://github.com/JarodMica/rvc-python", rev = "9a67ac77743d749e9f2cbbb02798957d5343fd19" }
"scikit-learn" = "==1.4.2"
"sentence-transformers" = "==5.1.0"
sounddevice = "==0.5.1"
soundfile = "==0.13.1"
tensorboardx = "*"
tiktoken = "==0.11.0"
torchcodec = "==0.10.0"
torchcrepe = "*"
transformers = "==4.57.3"
translators = "==6.0.1"
uvicorn = "*"
ipython = "==9.4.0"
scipy = "==1.13.1"

[tool.pixi.pypi-options.dependency-overrides]
# rvc-python's metadata still pins numpy<=1.23.5; override so it doesn't conflict with numpy==1.26.4.
numpy = "==1.26.4"
# omegaconf, hydra-core, and antlr4-python3-runtime are pinned to specific versions to avoid conflicts with fairseq and other dependencies. See
# https://github.com/facebookresearch/fairseq/issues/1000 for more information.
omegaconf = "==2.3.0"
"antlr4-python3-runtime" = "==4.9.3"
hydra-core = ">=1.3.2"

[tool.pixi.target.linux-64.dependencies]
# live2d-py's Linux source build requires OpenGL development headers (GL/gl.h).
libgl-devel = "*"

[tool.pixi.target.linux-64.pypi-dependencies]
# Community-patched cp311 build of fairseq fixing the Python 3.11 mutable-dataclass-default bug,
# mirroring the fix in the community wheel used on
# Source: https://github.com/JarodMica/rvc-python
fairseq = { path = "vendor/fairseq-0.12.4-cp311-cp311-linux_x86_64.whl" }
# Pin live2d-py to 0.5.4 on Linux to avoid build issues; Windows can use the latest version
"live2d-py" = "==0.5.4"

[tool.pixi.target.win-64.pypi-dependencies]
# Community-patched cp311 build of fairseq fixing the Python 3.11 mutable-dataclass-default bug.
# Source: https://github.com/JarodMica/rvc-python
fairseq = { url = "https://huggingface.co/Jmica/rvc/resolve/main/fairseq-0.12.4-cp311-cp311-win_amd64.whl" }

### Environments and features

[tool.pixi.environments]
default = { features = ["build", "dev"], solve-group = "default" }
cpu = { features = ["build", "cpu"], solve-group = "default" }
gpu = { features = ["build", "gpu"], solve-group = "default" }
build = { features = ["build"] }
dev = { features = ["dev"] }

# CPU-only dependencies
[tool.pixi.feature.cpu.pypi-dependencies]
torch = "==2.10.0"
torchaudio = "==2.10.0"
torchvision = "==0.25.0"

# CUDA-enabled versions for the GPU environment.
[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.10.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.25.0", index = "https://download.pytorch.org/whl/cu128" }

[tool.pixi.feature.build.dependencies]
# Compiler toolchains and other build-only packages belong here.
# Needed to build fairseq from source on Linux (vendor/fairseq-linux-patched)
# and other packages lacking prebuilt wheels for this platform/Python version.
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"


### Tasks (available via `pixi run <task>`)

[tool.pixi.tasks]
start = "python main.py"
test-lint = "ruff check"
lint = "ruff check --fix"

############
### Ruff ###
############

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "BLE", "E", "F", "FURB", "I", "N", "UP", "W"]
ignore = [
    "E501",   # Line too long
    "BLE001", # Do not capture blind exception 
]

[tool.ruff.lint.isort]
known-first-party = ["lr_reduction"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
