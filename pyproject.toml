########################
### Project Metadata ###
########################

[project]
name = "soul-of-waifu"
version = "2.5.0"
description = "Soul of Waifu desktop companion app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Dependencies are managed via Pixi; this list is only for metadata purposes.
]

####################
### Build config ###
####################

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

###################
### Pixi config ###
###################

[tool.pixi.workspace]
name = "soul-of-waifu"
platforms = ["win-64", "linux-64"]
channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"]
# Required until the build feature becomes stable
preview = ["pixi-build"]

### Dependency tables

[tool.pixi.dependencies]
python = ">=3.11,<3.12"
pip = "*"
setuptools = ">=80,<81"
sox = "*"

[tool.pixi.pypi-dependencies]
aiohttp = ">=3.11.13"
"antlr4-python3-runtime" = "==4.9.3"
av = ">=12.0.0"
beautifulsoup4 = ">=4.12.3"
"coqui-tts" = { version = ">=0.27.5", extras = ["codec"] }
"curl-cffi" = ">=0.15.0"
davey = ">=0.1.6"
ddgs = ">=7.3.0"
"discord.py" = ">=2.4.0"
"edge-tts" = ">=7.2.7"
elevenlabs = ">=1.52.0"
# fairseq is installed per-platform below: PyPI's 0.12.2 build fails to import
# on Python 3.11 (mutable dataclass defaults raise ValueError). Windows uses
# Jmica's community-patched wheel; Linux uses a locally patched build.
fastapi = ">=0.115.8"
faster-whisper = ">=1.0.3"
gputil = ">=1.4.0"
"hf-transfer" = ">=0.1.9"
httpx = ">=0.28.1"
"huggingface-hub" = ">=0.36.0"
hf_xet = ">=0.1.2"
kokoro = ">=0.9.4"
"live2d-py" = ">=0.5.4"
# Pinned <2.0.0: mistralai 2.x restructured into a namespace package (Mistral
# client moved to mistralai.client.sdk.Mistral), breaking `from mistralai import Mistral`.
mistralai = ">=1.5.0,<2.0.0"
mss = ">=9.0.1"
numpy = "==1.26.4"
omegaconf = "==2.3.0"
openai = ">=1.70.0"
pillow = ">=11.3.0"
playwright = ">=1.52.0"
portalocker = "==3.2.0"
"praat-parselmouth" = ">=0.4.7"
psutil = ">=7.0.0"
pyaudio = ">=0.2.14"
pydub = ">=0.25.1"
pynacl = ">=1.5.0"
pyopengl = ">=3.1.9"
pypdf = ">=6.14.2"
pyqt6 = ">=6.9.0,<6.10.0"
"pyqt6-webengine" = ">=6.9.0,<6.10.0"
"python-docx" = ">=1.2.0"
python-multipart = ">=0.0.22"
pyworld = "==0.3.5"
pyyaml = ">=6.0.2"
qasync = ">=0.27.1"
"qwen-tts" = ">=0.1.1"
requests = ">=2.32.3"
"rvc-python" = { git = "https://github.com/JarodMica/rvc-python", rev = "9a67ac77743d749e9f2cbbb02798957d5343fd19" }
"scikit-learn" = ">=1.4.2"
"sentence-transformers" = "==5.1.0"
sounddevice = ">=0.5.1"
soundfile = ">=0.13.1"
tensorboardx = ">=2.6.5"
tiktoken = ">=0.11.0"
torch = "==2.10.0"
torchaudio = "==2.10.0"
torchcodec = "==0.10.0"
torchcrepe = ">=0.0.24"
torchvision = "==0.25.0"
transformers = ">=4.57.3"
translators = ">=6.0.1"
uvicorn = ">=0.41.0"

"en-core-web-sm" = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl#sha256=86cc141f63942d4b2c5fcee06630fd6f904788d2f0ab005cce45aadb8fb73889" }

[tool.pixi.pypi-options.dependency-overrides]
# rvc-python's metadata still pins numpy<=1.23.5; override so it doesn't conflict with numpy==1.26.4.
numpy = "==1.26.4"
# fairseq's metadata still pins omegaconf<2.1 (and, via hydra-core, antlr4-python3-runtime==4.8);
# override both so they don't conflict with the versions omegaconf==2.3.0 actually needs.
omegaconf = "==2.3.0"
"antlr4-python3-runtime" = "==4.9.3"
# fairseq also pins hydra-core<1.1, but that version's internals (e.g.
# hydra._internal.utils importing omegaconf._utils.get_ref_type) are
# incompatible with omegaconf==2.3.0. hydra-core>=1.3.2 supports omegaconf~=2.2.
hydra-core = ">=1.3.2"

[tool.pixi.target.linux-64.dependencies]
# live2d-py's Linux source build requires OpenGL development headers (GL/gl.h).
libgl-devel = "*"

[tool.pixi.target.linux-64.pypi-dependencies]
# PyPI's fairseq==0.12.2 fails to import on Python 3.11 (mutable dataclass
# defaults in fairseq/dataclass/configs.py and
# fairseq/models/transformer/transformer_config.py raise
# "ValueError: mutable default ... use default_factory"). No fixed release
# exists upstream (repo is archived; latest tag is v0.12.3 and still broken).
# This is a prebuilt wheel from the same source patched with
# field(default_factory=...), mirroring the fix in the community wheel used on
# Windows below. See vendor/fairseq-linux-patched for the patched source used
# to build it.
fairseq = { path = "vendor/fairseq-0.12.4-cp311-cp311-linux_x86_64.whl" }

[tool.pixi.target.win-64.pypi-dependencies]
# Community-patched cp311 build of fairseq fixing the same Python 3.11
# mutable-dataclass-default bug (see linux-64 target above for details).
# Source: https://github.com/JarodMica/rvc-python
fairseq = { url = "https://huggingface.co/Jmica/rvc/resolve/main/fairseq-0.12.4-cp311-cp311-win_amd64.whl" }

### Environments and features

[tool.pixi.environments]
default = { features = ["build", "dev"], solve-group = "default" }
build = { features = ["build"] }
dev = { features = ["dev"] }

[tool.pixi.feature.build.dependencies]
# Windows compiler toolchains and other build-only packages belong here.
# Needed to build fairseq from source on Linux (vendor/fairseq-linux-patched)
# and other packages lacking prebuilt wheels for this platform/Python version.
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"

### Tasks (available via `pixi run <task>`)

[tool.pixi.tasks]
start = "python main.py"
test-lint = "ruff check"
lint = "ruff check --fix"

############
### Ruff ###
############

[tool.ruff]
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb", "scripts/**", "tests/data/**"]

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "BLE", "E", "F", "FURB", "I", "N", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["lr_reduction"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
