name: ChatGPT account tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chatgpt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install "PyJWT[crypto]>=2.10.1,<3" filelock requests httpx openai==1.70.0 PyQt6==6.9.0 PyYAML==6.0.2
      - name: Run offline protocol and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_chatgpt*.py" -v
