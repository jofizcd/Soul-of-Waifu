<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soul of Waifu - Web</title>
    <link rel="stylesheet" href="/static/style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
          "loadMixamo": "/vrm/modules/loadMixamoAnimation.js"
        }
      }
    </script>
</head>
<body>
    <header>
        <img id="char-avatar" class="avatar-circle" src="/api/avatar/None" alt="">
        <div class="char-info">
            <h2 id="char-name">Loading...</h2>
            <p id="status-text">Connecting...</p>
        </div>
        <button id="menu-btn" title="Character Library">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
        </button>
    </header>

    <div id="main-content">
        <div id="avatar-container">
            <canvas id="avatar-canvas"></canvas>
            <img id="avatar-image" class="hidden" src="" alt="">
            
            <button id="l2d-panel-toggle" class="hidden" title="Live2D Animations">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </button>

            <div id="l2d-controls-panel" class="hidden">
                <div class="panel-header">
                    <h3>Emotions and Movements Live2D</h3>
                    <button id="l2d-panel-close">&times;</button>
                </div>
                <div class="panel-sections">
                    <div class="panel-section">
                        <h4>Expressions</h4>
                        <div id="l2d-expressions-list" class="button-grid"></div>
                    </div>
                    <div class="panel-section">
                        <h4>Motions</h4>
                        <div id="l2d-motions-list" class="button-grid"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="chat-container"></div>
    </div>

    <div id="typing-indicator" class="hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <button id="stop-btn" title="Stop generation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
        </button>
    </div>

    <footer>
        <div class="input-wrapper">
            <button id="mic-btn" title="Voice input">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </button>
            <textarea id="msg-input" rows="1" placeholder="Write your message here..." autocomplete="off"></textarea>
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </footer>

    <div id="main-menu" class="hidden">
        <div class="menu-content">
            <div class="menu-header">
                <h2>Select Character</h2>
                <button id="close-menu-btn">&times;</button>
            </div>
            <div id="character-grid"></div>
        </div>
    </div>

    <script type="module" src="/static/script.js"></script>
</body>
</html>
