about_program_description: "<b>Soul of Waifu</b> — это продвинутая платформа для ведения ролевых игр с искуственным интеллектом, созданная для воплощения виртуальных личностей в жизнь внутри полноценной экосистемы. Создавайте уникальных персонажей с нуля или мгновенно импортируйте их простым перетаскиванием (Drag-and-Drop) стандартных карточек V2. Запускайте модели с полной конфиденциальностью на собственном оборудовании через GGUF (с аппаратным ускорением под CPU, CUDA, Vulkan, AMD HIP и Intel SYCL) или подключайтесь к ведущим облачным API, включая OpenAI, Anthropic, DeepSeek и Google Gemini.<br><br>Наша уникальная когнитивная архитектура полностью переосмысляет границы общения с ИИ. Благодаря модулю <b>Soul Memory</b> персонажи формируют настоящие, самоисцеляющиеся долгосрочные воспоминания и ведут личные дневники, выходя далеко за рамки классического векторного поиска (RAG). Наслаждайтесь бесшовным живым общением с интерактивными Live2D и VRM аватарами, речь которых генерируется на лету через множество движков Text-to-Speech.<br><br>Управляйте своим опытом в разных режимах: ведите глубокие настольные ролевые игры в режиме <b>Soul Stage</b> под руководством виртуального Мастера Игры, или выведите на рабочий стол полупрозрачный виджет <b>Soul Companion</b>. Спутник управляется динамической нейрогормональной системой, реагирует на вашу активность на экране, читает буфер обмена, ищет информацию в сети и поддерживает кастомные MCP-инструменты. Общайтесь так, как удобно именно вам — на ПК, в Discord или со смартфона через встроенный локальный веб-клиент!"
