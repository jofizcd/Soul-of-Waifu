about_program: "About Soul of Waifu"
about_program_title: "About Soul of Waifu"
about_program_description: "<b>Soul of Waifu</b> is an advanced AI-powered role-playing game platform. Build unique characters from scratch, or instantly drag-and-drop standard V2 character cards. Run models with complete privacy on your own hardware via GGUF (optimized for CPU, CUDA, Vulkan, AMD HIP, and Intel SYCL) or connect seamlessly to leading cloud APIs, including OpenAI, Anthropic, DeepSeek, and Google Gemini.<br><br>Our proprietary cognitive architecture reshapes the boundaries of AI interaction. With <b>Soul Memory</b>, characters form genuine, self-healing long-term memories and private diary entries, moving far beyond static database lookups (RAG). Engage in fluid, real-time conversations featuring reactive Live2D and VRM avatars, synced with ultra-low-latency streaming audio powered by multiple Text-to-Speech engines.<br><br>Shape your journey across multiple modes: guide rich, tabletop-style RPGs in <b>Soul Stage</b> under the control of an AI Game Master, or host a <b>Soul Companion</b> overlay on your desktop. Driven by a dynamic neurohormonal system, the Companion proactively reacts to your active workspace, reads your clipboard, searches the web, and integrates custom MCP tools. Chat your way—directly on your desktop, via Discord, or from your phone using the built-in local web client!"
